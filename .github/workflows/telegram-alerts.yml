name: 24/7 AI Gold Telegram Alerts

on:
  schedule:
    # Runs every 15 minutes Monday through Friday (Forex market hours)
    - cron: '*/15 * * * 1-5'
  push:
    paths:
      - 'telegram_alerts.py'
      - '.github/workflows/telegram-alerts.yml'
  workflow_dispatch:

jobs:
  scan-and-alert:
    name: Scan Gold Market (1:3 R:R & 50+ Pts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Market Scan Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_alerts.py
